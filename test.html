<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백수완의 성장 일지 (Beta)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; transition: all 0.3s; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .grass-cell { width: 12px; height: 12px; border-radius: 2px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <nav class="sticky top-0 z-50 border-b glass">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="font-bold text-xl tracking-tight text-indigo-600">soowanbaek.com</h1>
            <div class="flex gap-6 text-sm font-semibold text-slate-500">
                <button onclick="showSection('dashboard')" class="nav-btn hover:text-indigo-600 active text-indigo-600">대시보드</button>
                <button onclick="showSection('entry')" class="nav-btn hover:text-indigo-600">오늘 기록</button>
                <button onclick="showSection('archive')" class="nav-btn hover:text-indigo-600">아카이브</button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8">
        
        <section id="dashboard" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center">
                    <p class="text-slate-500 text-sm mb-4 w-full font-bold">전체 성공률</p>
                    <div class="w-40 h-40">
                        <canvas id="successChart"></canvas>
                    </div>
                </div>
                
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-slate-500 text-sm mb-4 font-bold">섹션별 시도 횟수</p>
                    <div id="categoryList" class="space-y-4">
                        <div class="flex justify-between items-center text-sm">
                            <span>📖 독서</span> <span id="count-reading" class="font-mono font-bold">0</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span>💪 운동</span> <span id="count-exercise" class="font-mono font-bold">0</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span>✍️ 공부</span> <span id="count-study" class="font-mono font-bold">0</span>
                        </div>
                    </div>
                </div>

                <div class="bg-indigo-600 p-6 rounded-2xl shadow-lg text-white relative overflow-hidden">
                    <p class="text-indigo-100 text-sm mb-1">Fediverse Sync</p>
                    <h3 class="text-xl font-bold">note.soowanbaek.com</h3>
                    <p class="text-xs mt-2 opacity-80">@sw 계정에서 실시간 데이터를 가져옵니다.</p>
                    <button onclick="loadData()" class="mt-4 bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition">
                        <i data-lucide="refresh-cw" class="w-3 h-3"></i> 새로고침
                    </button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="flex justify-between items-center mb-6">
                    <h4 class="font-bold">Yearly Growth Grass</h4>
                    <span class="text-xs text-slate-400">최근 90일 기준</span>
                </div>
                <div class="flex flex-wrap gap-1.5 justify-start" id="heatmap">
                    </div>
            </div>
        </section>

        <section id="entry" class="hidden max-w-lg mx-auto bg-white p-8 rounded-3xl shadow-xl border border-slate-100 text-center">
            <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <i data-lucide="pen-tool" class="w-8 h-8"></i>
            </div>
            <h2 class="text-2xl font-bold mb-2">성장 기록하기</h2>
            <p class="text-slate-500 text-sm mb-8">마이크로블로그에 자동으로 태그가 포함된 포스트를 작성합니다.</p>
            
            <div class="space-y-4">
                <a id="postLink" href="https://note.soowanbaek.com/@sw" target="_blank" 
                   class="block w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 transition">
                   내 마이크로블로그로 이동
                </a>
                <p class="text-[10px] text-slate-400">※ #성장일지 #reading #success 등의 태그를 꼭 포함해주세요.</p>
            </div>
        </section>

        <section id="archive" class="hidden space-y-4">
            <h2 class="text-xl font-bold mb-6">성장 타임라인</h2>
            <div id="feedList" class="space-y-4">
                <div class="text-center py-10 text-slate-400">데이터를 불러오는 중...</div>
            </div>
        </section>

    </main>

    <script>
        lucide.createIcons();

        // 설정값 (나중에 본인 계정 ID로 수정 필요)
        const INSTANCE = "https://note.soowanbaek.com";
        const ACCOUNT_ID = "8dffb86f-2be7-41d7-99ef-91403b1bb1d2"; // lookup API로 확인한 ID 권장

        let successChart = null;

        function showSection(id) {
            document.querySelectorAll('main > section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            
            // Nav active style
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('text-indigo-600'));
            event.target.classList.add('text-indigo-600');
        }

        async function loadData() {
            try {
                // 실제 GoToSocial API 호출 (해시태그 필터링)
                const res = await fetch(`${INSTANCE}/api/v1/accounts/${ACCOUNT_ID}/statuses?limit=40`);
                const data = await res.json();
                
                // #성장일지 태그가 있는 것만 필터링
                const growthLogs = data.filter(p => p.tags.some(t => t.name === '성장일지'));
                
                renderDashboard(growthLogs);
                renderArchive(growthLogs);
                renderHeatmap(growthLogs);
            } catch (e) {
                console.error("데이터 로딩 실패:", e);
                alert("데이터를 불러오지 못했습니다. 인스턴스 주소나 ID를 확인해주세요.");
            }
        }

        function renderDashboard(logs) {
            const stats = {
                success: logs.filter(l => l.tags.some(t => t.name === 'success')).length,
                fail: logs.filter(l => l.tags.some(t => t.name === 'fail')).length,
                reading: logs.filter(l => l.tags.some(t => t.name === 'reading')).length,
                exercise: logs.filter(l => l.tags.some(t => t.name === 'exercise')).length,
                study: logs.filter(l => l.tags.some(t => t.name === 'study')).length
            };

            document.getElementById('count-reading').innerText = stats.reading;
            document.getElementById('count-exercise').innerText = stats.exercise;
            document.getElementById('count-study').innerText = stats.study;

            // Chart.js 업데이트
            const ctx = document.getElementById('successChart').getContext('2d');
            if(successChart) successChart.destroy();
            successChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['성공', '실패'],
                    datasets: [{
                        data: [stats.success, stats.fail || 1],
                        backgroundColor: ['#4f46e5', '#e2e8f0'],
                        borderWidth: 0
                    }]
                },
                options: { cutout: '70%', plugins: { legend: { display: false } } }
            });
        }

        function renderArchive(logs) {
            const feed = document.getElementById('feedList');
            feed.innerHTML = logs.map(log => `
                <div class="bg-white p-5 rounded-2xl border border-slate-100 flex gap-4 hover:border-indigo-200 transition">
                    <div class="text-2xl">${log.tags.some(t => t.name === 'success') ? '✅' : '❌'}</div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-slate-800">${new Date(log.created_at).toLocaleDateString()}</span>
                            <span class="text-[10px] bg-slate-100 px-2 py-1 rounded text-slate-500 uppercase font-mono">
                                ${log.tags.find(t => ['reading','exercise','study'].includes(t.name))?.name || 'LOG'}
                            </span>
                        </div>
                        <div class="mt-2 text-slate-600 text-sm leading-relaxed">${log.content}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderHeatmap(logs) {
            const heatmap = document.getElementById('heatmap');
            heatmap.innerHTML = '';
            const today = new Date();
            
            // 최근 90일 생성
            for(let i=90; i>=0; i--) {
                const date = new Date();
                date.setDate(today.getDate() - i);
                const dateStr = date.toISOString().split('T')[0];
                
                const dayLog = logs.find(l => l.created_at.startsWith(dateStr));
                let colorClass = 'bg-slate-100';
                if(dayLog) {
                    colorClass = dayLog.tags.some(t => t.name === 'success') ? 'bg-indigo-500' : 'bg-indigo-200';
                }
                
                heatmap.innerHTML += `<div class="grass-cell ${colorClass}" title="${dateStr}"></div>`;
            }
        }

        // 초기 실행
        loadData();
    </script>
</body>
</html>
